<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>複数画像アニメーション工房</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#222;background:#f4f6f8}body{margin:0;padding:16px}main{max-width:1050px;margin:auto;background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 16px #0001}h1{margin:0 0 6px;font-size:1.5rem}.sub{color:#555;margin:0 0 16px}.toolbar,.exportrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}button{padding:9px 13px;border:1px solid #bbb;background:#fff;border-radius:8px;cursor:pointer;font-size:14px}button.primary{background:#155eef;color:#fff;border-color:#155eef}button:disabled{opacity:.45;cursor:not-allowed}input[type=number]{width:90px;padding:7px;border:1px solid #bbb;border-radius:7px}#preview{background:#171717;border-radius:10px;min-height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden}#preview img{max-width:100%;max-height:420px;object-fit:contain}#frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;margin-top:14px}.frame{border:1px solid #ddd;border-radius:10px;padding:10px;min-width:0}.frame img{width:100%;height:120px;object-fit:contain;background:#eee;border-radius:6px}.frame .name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:6px 0}.frame .duration{display:flex;align-items:center;gap:4px;font-size:13px}.frame .actions{display:flex;gap:4px;margin-top:7px}.frame .actions button{flex:1;padding:6px}.status{padding:10px;background:#f1f5ff;border-radius:8px;min-height:20px;white-space:pre-wrap}.hint{font-size:12px;color:#555}.hidden{display:none!important}
</style></head><body><main><h1>複数画像アニメーション工房</h1><p class="sub">画像ごとに表示時間を設定してプレビューし、GIFとして保存します。GIF生成は内蔵処理で、外部ライブラリ不要です。</p>
<div class="toolbar"><label>画像追加 <input id="files" type="file" accept="image/*" multiple></label><label>共通時間 <input id="bulk" type="number" min="20" max="60000" step="10" value="500"> ms</label><button id="apply">全コマに適用</button><button id="play" class="primary">▶ 再生</button><button id="stop">■ 停止</button><label>出力サイズ <select id="scale"><option value="1">100%（原寸）</option><option value="0.75">75%</option><option value="0.5">50%</option></select></label><label>繰り返し <select id="loops"><option value="0">無限</option><option value="1">1回</option><option value="3">3回</option></select></label></div>
<div id="preview"><span style="color:#ddd">画像を追加してください</span></div><div class="exportrow"><button id="gif" class="primary">GIFを書き出して保存</button><button id="clear">全画像を削除</button></div><div id="status" class="status">待機中。画像を追加してください。</div><div id="frames"></div><p class="hint">書き出しは元画像の解像度を縮小しません。GIFは仕様上256色までのため色再現には限界があります。表示時間は10ms単位に丸められます。サイズが大きすぎる場合は縮小せずエラー表示します。</p></main>
<script>"use strict";
const $=id=>document.getElementById(id);let frames=[],seq=0,playing=false,playToken=0;
function setStatus(s){$('status').textContent=s}
function clampDuration(v){let n=Number(v);if(!Number.isFinite(n))n=500;return Math.max(20,Math.min(60000,Math.round(n/10)*10))}
function drawList(){const root=$('frames');root.innerHTML='';frames.forEach((f,i)=>{const card=document.createElement('div');card.className='frame';card.dataset.id=f.id;const img=document.createElement('img');img.src=f.src;img.alt='frame '+(i+1);const name=document.createElement('div');name.className='name';name.title=f.name;name.textContent=(i+1)+'. '+f.name;const label=document.createElement('label');label.className='duration';label.append('表示時間 ');const input=document.createElement('input');input.type='number';input.min='20';input.max='60000';input.step='10';input.value=f.duration;input.addEventListener('change',()=>{f.duration=clampDuration(input.value);input.value=f.duration});label.append(input,document.createTextNode(' ms'));const actions=document.createElement('div');actions.className='actions';[['↑',()=>move(i,-1)],['↓',()=>move(i,1)],['削除',()=>removeFrame(i)]].forEach(([txt,fn])=>{const b=document.createElement('button');b.textContent=txt;b.disabled=(txt==='↑'&&i===0)||(txt==='↓'&&i===frames.length-1);b.onclick=fn;actions.append(b)});card.append(img,name,label,actions);root.append(card)});updateBtns()}
function updateBtns(){$('play').disabled=!frames.length;$('stop').disabled=!playing;$('gif').disabled=!frames.length}
function move(i,d){const j=i+d;if(j<0||j>=frames.length)return;[frames[i],frames[j]]=[frames[j],frames[i]];drawList()}
function removeFrame(i){frames.splice(i,1);drawList();if(!frames.length){$('preview').innerHTML='<span style="color:#ddd">画像を追加してください</span>';stopPreview()}}
function stopPreview(){playing=false;playToken++;updateBtns()}
$('files').addEventListener('change',async ev=>{const picked=[...ev.target.files];for(const file of picked){if(!file.type.startsWith('image/'))continue;const src=URL.createObjectURL(file);try{await loadImage(src);frames.push({id:++seq,src,name:file.name,duration:clampDuration($('bulk').value)});}catch(e){URL.revokeObjectURL(src);setStatus('画像を読み込めません: '+file.name)} }drawList();if(frames.length)setStatus(frames.length+'枚の画像を読み込みました。各コマの表示時間を設定できます。');ev.target.value=''});
function loadImage(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('画像読込エラー'));im.src=src})}
$('apply').onclick=()=>{const dur=clampDuration($('bulk').value);$('bulk').value=dur;frames.forEach(f=>f.duration=dur);drawList();setStatus('全'+frames.length+'コマに '+dur+' ms を適用しました')};
$('play').onclick=async()=>{if(!frames.length||playing)return;playing=true;const token=++playToken;updateBtns();let count=$('loops').value==='0'?Infinity:Number($('loops').value);setStatus('プレビュー再生中');try{while(playing&&token===playToken&&count>0){for(const f of frames){if(!playing||token!==playToken)break;const img=await loadImage(f.src);$('preview').replaceChildren(img);await new Promise(r=>setTimeout(r,f.duration));}if(count!==Infinity)count--;} }finally{if(token===playToken){playing=false;updateBtns();setStatus('プレビュー停止')}}};$('stop').onclick=stopPreview;
$('clear').onclick=()=>{stopPreview();frames.forEach(f=>URL.revokeObjectURL(f.src));frames=[];drawList();$('preview').innerHTML='<span style="color:#ddd">画像を追加してください</span>';setStatus('画像をすべて削除しました')};
// GIF89a encoder (original frame resolution retained; GIF color limited to 256 colors) - self-contained
// Adaptive global palette (median-cut over a 5-bit RGB histogram), replacing the damaging fixed 3-3-2 palette.
function buildAdaptivePalette(frameRgba){
 const hist=new Map(); for(const rgba of frameRgba){for(let i=0;i<rgba.length;i+=4){if(rgba[i+3]<16)continue;const r=rgba[i]>>3,g=rgba[i+1]>>3,b=rgba[i+2]>>3,key=(r<<10)|(g<<5)|b;const v=hist.get(key);if(v)v.count++;else hist.set(key,{r:r*8+4,g:g*8+4,b:b*8+4,count:1});}}
 let colors=[...hist.values()]; if(!colors.length)colors=[{r:0,g:0,b:0,count:1}];
 const boxOf=list=>{let min=[255,255,255],max=[0,0,0],total=0;for(const c of list){let a=[c.r,c.g,c.b];for(let k=0;k<3;k++){min[k]=Math.min(min[k],a[k]);max[k]=Math.max(max[k],a[k])}total+=c.count}return {list,min,max,total,range:Math.max(max[0]-min[0],max[1]-min[1],max[2]-min[2])}};
 let boxes=[boxOf(colors)];while(boxes.length<256){let bi=-1,bscore=-1;for(let i=0;i<boxes.length;i++){let box=boxes[i];if(box.list.length<2)continue;let score=box.range*Math.log2(box.total+1);if(score>bscore){bscore=score;bi=i}}if(bi<0)break;const box=boxes.splice(bi,1)[0],channel=box.max[0]-box.min[0]>=box.max[1]-box.min[1]&&box.max[0]-box.min[0]>=box.max[2]-box.min[2]?0:box.max[1]-box.min[1]>=box.max[2]-box.min[2]?1:2;box.list.sort((a,b)=>a[['r','g','b'][channel]]-b[['r','g','b'][channel]]);let acc=0,cut=box.list.length-1;for(let i=0;i<box.list.length-1;i++){acc+=box.list[i].count;if(acc>=box.total/2){cut=i;break}}boxes.push(boxOf(box.list.slice(0,cut+1)),boxOf(box.list.slice(cut+1)))}
 const pal=[];for(const box of boxes){let r=0,g=0,b=0,n=0;for(const c of box.list){r+=c.r*c.count;g+=c.g*c.count;b+=c.b*c.count;n+=c.count}pal.push([Math.round(r/n),Math.round(g/n),Math.round(b/n)])}while(pal.length<256)pal.push(pal[pal.length-1]);return pal.slice(0,256)
}
function mapPixels(rgba,palette){const out=new Uint8Array(rgba.length/4),cache=new Map();let pi=0;for(let i=0;i<rgba.length;i+=4,pi++){const r=rgba[i],g=rgba[i+1],b=rgba[i+2],key=(r>>3)<<10|(g>>3)<<5|(b>>3);if(cache.has(key)){out[pi]=cache.get(key);continue}let best=0,bd=Infinity;for(let j=0;j<palette.length;j++){const c=palette[j],dr=r-c[0],dg=g-c[1],db=b-c[2],d=dr*dr*0.299+dg*dg*0.587+db*db*0.114;if(d<bd){bd=d;best=j}}cache.set(key,best);out[pi]=best}return out}
function paletteBytes(palette){const bytes=new Uint8Array(768);for(let i=0;i<256;i++){const c=palette[i]||palette[palette.length-1];bytes[i*3]=c[0];bytes[i*3+1]=c[1];bytes[i*3+2]=c[2]}return bytes}
function lzw(indices){const clear=256,end=257;let next=258,codeSize=9,dict=new Map(),bits=[],acc=0,nb=0;function emit(code){acc|=code<<nb;nb+=codeSize;while(nb>=8){bits.push(acc&255);acc>>=8;nb-=8}}function reset(){dict=new Map();next=258;codeSize=9}reset();emit(clear);if(indices.length){let prefix=indices[0];for(let k=1;k<indices.length;k++){const sym=indices[k],key=(prefix<<8)|sym;if(dict.has(key)){prefix=dict.get(key)}else{emit(prefix);if(next<4096){dict.set(key,next++);if(next>(1<<codeSize)&&codeSize<12)codeSize++}else{emit(clear);reset()}prefix=sym}}emit(prefix)}emit(end);if(nb>0)bits.push(acc&255);return bits}
function encodeGIF(frameList,w,h,loopCount,palette){const out=[];const pushByte=v=>out.push(v&255);const pushWord=v=>{pushByte(v);pushByte(v>>8)};const pushStr=s=>{for(let i=0;i<s.length;i++)pushByte(s.charCodeAt(i))};pushStr('GIF89a');pushWord(w);pushWord(h);pushByte(0xF7);pushByte(0);pushByte(0);const pal=paletteBytes(palette);for(const v of pal)pushByte(v);
// Netscape loop extension: 0=infinite, positive value is repetition count
pushByte(0x21);pushByte(0xFF);pushByte(11);pushStr('NETSCAPE2.0');pushByte(3);pushByte(1);pushWord(loopCount);pushByte(0);
for(const fr of frameList){const delay=Math.max(1,Math.round(fr.duration/10));pushByte(0x21);pushByte(0xF9);pushByte(4);pushByte(0);pushWord(delay);pushByte(0);pushByte(0);pushByte(0x2C);pushWord(0);pushWord(0);pushWord(w);pushWord(h);pushByte(0);pushByte(8);const compressed=lzw(fr.pixels);for(let p=0;p<compressed.length;p+=255){const n=Math.min(255,compressed.length-p);pushByte(n);for(let j=0;j<n;j++)pushByte(compressed[p+j])}pushByte(0)}pushByte(0x3B);return new Uint8Array(out)}
function prepareGIFFrames(){return new Promise(async(resolve,reject)=>{try{const scale=Number($('scale').value)||1;const loaded=[];let w=0,h=0;for(const f of frames){const im=await loadImage(f.src);w=Math.max(w,im.naturalWidth);h=Math.max(h,im.naturalHeight);loaded.push({im,duration:f.duration})}if(!w||!h)throw new Error('画像の寸法を取得できません');if(w>65535||h>65535)throw new Error('GIF規格上の最大寸法(65535px)を超えています');const cw=Math.max(1,Math.round(w*scale)),ch=Math.max(1,Math.round(h*scale));if(cw*ch>50000000)throw new Error('出力サイズが非常に大きく、ブラウザのメモリ保護上書き出せません。出力サイズを75%または50%にしてください');const canvas=document.createElement('canvas');canvas.width=cw;canvas.height=ch;const ctx=canvas.getContext('2d',{willReadFrequently:true});if(!ctx)throw new Error('Canvasを作成できません');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';const rgbaFrames=[];for(const {im,duration} of loaded){ctx.fillStyle='#000';ctx.fillRect(0,0,cw,ch);ctx.drawImage(im,Math.round((cw-im.naturalWidth*scale)/2),Math.round((ch-im.naturalHeight*scale)/2),Math.round(im.naturalWidth*scale),Math.round(im.naturalHeight*scale));rgbaFrames.push({rgba:ctx.getImageData(0,0,cw,ch).data,duration})}const palette=buildAdaptivePalette(rgbaFrames.map(x=>x.rgba));const prepared=rgbaFrames.map(x=>({pixels:mapPixels(x.rgba,palette),duration:x.duration}));resolve({w:cw,h:ch,frames:prepared,palette})}catch(e){reject(e)}})}
$('gif').onclick=async()=>{if(!frames.length)return;const btn=$('gif');btn.disabled=true;stopPreview();setStatus('GIF準備中… 画像を変換しています');try{const {w,h,frames:gifFrames,palette}=await prepareGIFFrames();setStatus('GIFを生成中… '+w+'×'+h+' / '+gifFrames.length+'コマ');await new Promise(r=>setTimeout(r,20));const loops=Number($('loops').value);const data=encodeGIF(gifFrames,w,h,loops,palette);const blob=new Blob([data],{type:'image/gif'});if(!blob.size)throw new Error('生成データが空です');const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='animation.gif';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);setStatus('GIF生成完了：'+(blob.size/1024).toFixed(1)+' KB。保存が開始されました。')}catch(err){console.error(err);setStatus('書き出し失敗: '+(err?.message||err))}finally{btn.disabled=!frames.length}};
drawList();
</script></body></html>
