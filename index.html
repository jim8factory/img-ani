<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>複数画像アニメーション工房</title>
<style>
:root{font-family:system-ui,"Meiryo",sans-serif;color:#18212b;background:#f3f6fa}body{margin:0;padding:18px}h1{font-size:1.45rem;margin:0 0 12px}.panel{background:#fff;border:1px solid #d6dfeb;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 2px 7px #00000008}button,input,select{font:inherit;padding:8px;border-radius:8px;border:1px solid #b8c6d6}button{background:#e8f1ff;cursor:pointer}button:hover{background:#d9e8ff}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.frame-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.frame{border:1px solid #d7e0eb;border-radius:10px;padding:9px;background:#fbfdff}.frame img{width:100%;height:150px;object-fit:contain;background:#edf1f6;border-radius:6px}.frame .name{font-size:.9rem;overflow-wrap:anywhere;margin:5px 0}.frame input.duration{width:100px}.preview{display:flex;justify-content:center;align-items:center;min-height:260px;background:#101820;border-radius:10px}.preview img{max-width:100%;max-height:60vh;object-fit:contain}#status{white-space:pre-wrap;color:#30445b}.small{font-size:.88rem;color:#516478}canvas{display:none}
</style></head><body>
<h1>複数画像アニメーション工房</h1>
<section class="panel"><div class="row"><label>画像を追加：<input id="files" type="file" accept="image/*" multiple></label><button id="clear">全画像を削除</button></div><p class="small">画像は端末内で処理します。コマの表示時間は各画像ごとに保存され、移動・削除後もその画像に紐づきます。</p></section>
<section class="panel"><h2>画像検索（Wikimedia Commons）</h2><div class="row"><input id="search" placeholder="検索する画像・言葉" style="flex:1;min-width:180px"><button id="searchBtn">検索</button></div><div id="searchResults" class="row"></div></section>
<section class="panel"><h2>コマ設定</h2><div class="row"><label>共通表示時間(ms)：<input id="commonDuration" type="number" min="20" step="10" value="500"></label><button id="applyAll">全コマに適用</button><label>繰り返し：<select id="repeat"><option value="1">1回</option><option value="3">3回</option><option value="0">無限（プレビュー）</option></select></label></div><div id="frames" class="frame-list" style="margin-top:12px"></div></section>
<section class="panel"><h2>プレビュー</h2><div class="preview"><img id="previewImage" alt="アニメーションプレビュー"></div><div class="row" style="margin-top:10px"><button id="play">再生</button><button id="stop">停止</button><button id="exportGif">GIFを書き出す</button><button id="exportVideo">動画(WebM)を書き出す</button></div><p id="status">画像を追加して再生してください。</p></section><canvas id="canvas"></canvas>
<script>"use strict";
const frames=[];let nextId=1,playToken=0;const $=id=>document.getElementById(id);const preview=$("previewImage"),canvas=$("canvas"),ctx=canvas.getContext("2d");
function safeDuration(v){const n=Number(v);return Number.isFinite(n)?Math.max(20,Math.min(60000,Math.round(n))):500}
function renderFrames(){const host=$("frames");host.innerHTML="";frames.forEach((f,i)=>{const card=document.createElement("div");card.className="frame";const im=document.createElement("img");im.src=f.src;im.alt=f.name;const name=document.createElement("div");name.className="name";name.textContent=(i+1)+". "+f.name;const durLabel=document.createElement("label");durLabel.textContent="表示時間(ms)：";const dur=document.createElement("input");dur.className="duration";dur.type="number";dur.min="20";dur.step="10";dur.value=f.duration;dur.addEventListener("change",()=>{f.duration=safeDuration(dur.value);dur.value=f.duration;});durLabel.append(dur);const buttons=document.createElement("div");buttons.className="row";[["↑",()=>move(i,-1)],["↓",()=>move(i,1)],["削除",()=>removeFrame(i)]].forEach(([label,fn])=>{const b=document.createElement("button");b.textContent=label;b.addEventListener("click",fn);buttons.appendChild(b)});card.append(im,name,durLabel,buttons);host.append(card)});}
function addFrame(src,name,duration=Number($("commonDuration").value)||500){frames.push({id:nextId++,src,name,duration:safeDuration(duration)});renderFrames();}
function move(i,delta){const j=i+delta;if(j<0||j>=frames.length)return;const [f]=frames.splice(i,1);frames.splice(j,0,f);renderFrames()}
function removeFrame(i){frames.splice(i,1);renderFrames();if(!frames.length)preview.removeAttribute("src")}
$("files").addEventListener("change",e=>{for(const file of e.target.files){if(!file.type.startsWith("image/"))continue;const url=URL.createObjectURL(file);addFrame(url,file.name)}e.target.value=""});
$("clear").addEventListener("click",()=>{frames.splice(0);renderFrames();preview.removeAttribute("src");stopPlayback()});
$("applyAll").addEventListener("click",()=>{const d=safeDuration($("commonDuration").value);frames.forEach(f=>f.duration=d);renderFrames()});
function stopPlayback(){playToken++;}
async function playLoop(token){if(!frames.length){$("status").textContent="画像を追加してください。";return}const repeats=Number($("repeat").value);let cycle=0;while(token===playToken&&(repeats===0||cycle<repeats)){for(const f of frames){if(token!==playToken)return;preview.src=f.src;await new Promise(r=>setTimeout(r,f.duration));if(token!==playToken)return}cycle++}if(token===playToken)$("status").textContent="プレビュー終了"}
$("play").addEventListener("click",()=>{stopPlayback();const token=playToken;$("status").textContent="再生中（各コマの表示時間を適用）";playLoop(token)});$("stop").addEventListener("click",()=>{stopPlayback();$("status").textContent="停止しました"});
// Commons search via public API; load thumbnails only after selecting a result.
$("searchBtn").addEventListener("click",async()=>{const q=$("search").value.trim();const out=$("searchResults");out.innerHTML="検索中…";if(!q){out.textContent="検索語を入力してください。";return}try{const url="https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(q)+"&gsrnamespace=6&gsrlimit=12&prop=imageinfo&iiprop=url&iiurlwidth=240&format=json&origin=*";const data=await fetch(url).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()});out.innerHTML="";const pages=Object.values(data.query?.pages||{});if(!pages.length){out.textContent="該当画像なし";return}pages.forEach(p=>{const img=p.imageinfo?.[0]?.thumburl||p.imageinfo?.[0]?.url;if(!img)return;const wrap=document.createElement("div");wrap.style.width="150px";wrap.style.padding="6px";const im=document.createElement("img");im.src=img;im.style.cssText="width:140px;height:100px;object-fit:contain;background:#eee";const txt=document.createElement("div");txt.textContent=p.title.replace(/^File:/," ");txt.style.cssText="font-size:12px;overflow-wrap:anywhere";const b=document.createElement("button");b.textContent="この画像を追加";b.addEventListener("click",()=>addFrame(p.imageinfo[0].url,p.title));wrap.append(im,txt,b);out.append(wrap)});}catch(err){out.textContent="検索失敗："+err.message+"（通信環境を確認してください）"}});
function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.crossOrigin="anonymous";im.onload=()=>resolve(im);im.onerror=()=>reject(new Error("画像読み込み失敗"));im.src=src})}
function fitDraw(im){const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);const s=Math.min(w/im.width,h/im.height);const dw=im.width*s,dh=im.height*s;ctx.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh)}
async function exportVideo(){if(!frames.length){$("status").textContent="書き出す画像がありません";return}if(!window.MediaRecorder||!canvas.captureStream){$("status").textContent="このブラウザは動画録画に対応していません";return}stopPlayback();canvas.width=720;canvas.height=480;const stream=canvas.captureStream(30);let mime="video/webm;codecs=vp9";if(!MediaRecorder.isTypeSupported(mime))mime="video/webm";if(!MediaRecorder.isTypeSupported(mime)===false){$("status").textContent="WebM形式の録画に対応していません";return}const rec=new MediaRecorder(stream,{mimeType:mime});const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:rec.mimeType});downloadBlob(blob,"animation.webm");$("status").textContent="動画を書き出しました（WebM）"};rec.start();const passes=Math.max(1,Number($("repeat").value)||1);try{for(let k=0;k<passes;k++)for(const f of frames){const im=await loadImage(f.src);fitDraw(im);await new Promise(r=>setTimeout(r,f.duration))}rec.stop()}catch(e){rec.stop();$("status").textContent="動画書き出し失敗："+e.message}}
$("exportVideo").addEventListener("click",exportVideo);
function downloadBlob(blob,name){const a=document.createElement("a");const u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
async function exportGif(){if(!frames.length){$("status").textContent="書き出す画像がありません";return}if(!window.GIF){$("status").textContent="GIFライブラリを読み込み中…（ネット接続が必要）";try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js")}catch(e){$("status").textContent="GIFライブラリの読み込み失敗。ネット接続を確認してください。";return}if(!window.GIF){$("status").textContent="GIFライブラリが利用できません";return}}stopPlayback();$("status").textContent="GIF作成中…";const gif=new GIF({workers:2,quality:10,width:600,height:400,workerScript:"https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js"});try{for(const f of frames){const im=await loadImage(f.src);const c=document.createElement("canvas");c.width=600;c.height=400;const cctx=c.getContext("2d");cctx.fillStyle="#fff";cctx.fillRect(0,0,600,400);const scale=Math.min(600/im.width,400/im.height);const w=im.width*scale,h=im.height*scale;cctx.drawImage(im,(600-w)/2,(400-h)/2,w,h);gif.addFrame(cctx,{copy:true,delay:f.duration})}gif.on("finished",blob=>{downloadBlob(blob,"animation.gif");$("status").textContent="GIFを書き出しました"});gif.render()}catch(e){$("status").textContent="GIF書き出し失敗："+e.message}}
$("exportGif").addEventListener("click",exportGif);
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("script load error"));document.head.append(s)})}
</script></body></html>
